<!doctype html><html><head><meta charset="utf-8"><title>C02 Flow</title><link rel="stylesheet" href="card.css">
<style>
.flow { display: flex; align-items: center; margin-top: 130px; }
.step { width: 230px; height: 230px; border-radius: 32px; border: 3px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; background: #fff; }
.step .ico { font-size: 66px; line-height: 1; }
.step .t { font-size: 30px; font-weight: 700; margin-top: 18px; line-height: 1.15; }
.step.on { border-color: var(--green); background: var(--green-bg); }
.arrow { flex: 1; height: 6px; background: var(--line); position: relative; margin: 0 6px; overflow: hidden; border-radius: 3px; }
.arrow i { position: absolute; inset: 0; background: var(--green); transform: scaleX(0); transform-origin: left; }
.legend { margin-top: 80px; font-size: 34px; color: var(--muted); }
</style></head><body>
<div class="card">
  <div class="kicker in">How it works</div>
  <h1 class="in" style="animation-delay:.3s">Every call handled, end to end</h1>
  <div class="flow" id="flow"></div>
  <div class="legend in" style="animation-delay:7.4s">Same core logic for every business. Only the profile changes.</div>
</div>
<script>
const steps = [["📞","Call comes in"],["🤖","AI answers"],["✅","Qualifies"],["📅","Books"],["🗂️","CRM"],["📝","Summary to you"]];
const flow = document.getElementById("flow");
steps.forEach(([ico, t], i) => {
  if (i) flow.insertAdjacentHTML("beforeend", `<div class="arrow"><i id="a${i}"></i></div>`);
  flow.insertAdjacentHTML("beforeend", `<div class="step in" id="s${i}" style="animation-delay:${0.9 + i * 0.15}s"><div class="ico">${ico}</div><div class="t">${t}</div></div>`);
});
steps.forEach((_, i) => setTimeout(() => {
  if (i) document.getElementById("a" + i).animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 450, fill: "forwards" });
  setTimeout(() => document.getElementById("s" + i).classList.add("on"), i ? 450 : 0);
}, 2200 + i * 900));
</script></body></html>
